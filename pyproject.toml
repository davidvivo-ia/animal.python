[project]
name = "animal"
version = "1.0.0"
description = "ANIMAL (Creative Computing, 1973), rebuilt as a 2026 Textual TUI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "animal.python contributors" }]
requires-python = ">=3.13"
keywords = ["game", "tui", "textual", "retro", "basic", "learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "textual>=0.85",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "structlog>=24.1",
    "platformdirs>=4.2",
]

[project.scripts]
animal = "animal.presentation.cli:app"

[project.urls]
Repository = "https://github.com/davidvivo-ia/animal.python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "legacy", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "SIM",              # simplifications
    "C4",               # comprehensions
    "PIE",              # misc
    "RET",              # return
    "PTH",              # pathlib
    "RUF",              # ruff-specific
    "N",                # pep8-naming
    "TID",              # tidy imports
    "ARG",              # unused arguments
    "FBT",              # boolean traps
]
ignore = [
    "E501",   # line length handled by formatter
    "FBT001", # boolean positional args ok in dataclasses
    "FBT002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "FBT", "N802", "N803"]
"src/animal/presentation/cli.py" = ["FBT003", "ARG001"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/animal"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
]
